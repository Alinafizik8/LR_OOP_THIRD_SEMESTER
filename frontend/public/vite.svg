<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" style="background: #121212">
    <!-- Фон -->
    <rect width="100%" height="100%" fill="#121212"/>

    <!-- Капюшон -->
    <path d="M200,100 C150,50 250,0 400,0 C550,0 650,50 600,100 L600,400 L200,400 Z" fill="#2a2a2a" stroke="#1e1e1e" stroke-width="2"/>

    <!-- Лицо кота (черная маска) -->
    <circle cx="400" cy="250" r="120" fill="#000"/>

    <!-- Глаза -->
    <circle cx="350" cy="220" r="30" fill="#fff"/>
    <circle cx="450" cy="220" r="30" fill="#fff"/>
    <!-- Зрачки -->
    <circle cx="350" cy="220" r="15" fill="#000"/>
    <circle cx="450" cy="220" r="15" fill="#000"/>
    <!-- Блики в глазах -->
    <circle cx="340" cy="210" r="6" fill="#eee"/>
    <circle cx="440" cy="210" r="6" fill="#eee"/>

    <!-- Нос -->
    <ellipse cx="400" cy="270" rx="10" ry="8" fill="#1a1a1a"/>

    <!-- Усы (простые линии) -->
    <line x1="370" y1="280" x2="320" y2="290" stroke="#ddd" stroke-width="2"/>
    <line x1="370" y1="285" x2="320" y2="305" stroke="#ddd" stroke-width="2"/>
    <line x1="430" y1="280" x2="480" y2="290" stroke="#ddd" stroke-width="2"/>
    <line x1="430" y1="285" x2="480" y2="305" stroke="#ddd" stroke-width="2"/>

    <!-- Надпись ОКАК -->
    <text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff">
        ОКАК
    </text>
</svg>