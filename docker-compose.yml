version: '3.8'

services:
  db:
    image: postgres:15
    container_name: lr-oop-db
    environment:
      POSTGRES_DB: lr_oop_db       # ← имя БД (можно своё)
      POSTGRES_USER: postgres_user  # ← логин (можно свой)
      POSTGRES_PASSWORD: postgres_pass  # ← пароль (можно свой)
    ports:
      - "5432:5432"
    volumes:
      - pg/var/lib/postgresql/data

  app:
    build: .
    container_name: lr-oop-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lr_oop_db
      DB_USER: postgres_user
      DB_PASS: postgres_pass

volumes:
  pg