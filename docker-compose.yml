version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: lr-postgres
    environment:
      POSTGRES_DB: lr_oop_db
      POSTGRES_USER: lr_user
      POSTGRES_PASSWORD: lr_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lr_user -d lr_oop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lr-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lr_oop_db
      SPRING_DATASOURCE_USERNAME: lr_user
      SPRING_DATASOURCE_PASSWORD: lr_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: