version: '3.8'

services:
  db:
    image: postgres:15
    container_name: lr-oop-db
    environment:
      POSTGRES_DB: lr_oop_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_pass
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
      - ./java/functions/src/main/resources/scripts/create_table.sql:/docker-entrypoint-initdb.d/create_table.sql

  backend:
    build:
      context: ./java/functions
      dockerfile: Dockerfile
    container_name: lr-oop-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lr_oop_db
      DB_USER: postgres_user
      DB_PASS: postgres_pass

  frontend:
    build:
      context: ./java/ui
      dockerfile: Dockerfile
    container_name: lr-oop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg:
