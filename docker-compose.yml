services:
  postgres:
    image: postgres:16
    container_name: lr-postgres
    environment:
      POSTGRES_DB: lr_oop_db
      POSTGRES_USER: lr_user
      POSTGRES_PASSWORD: lr_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lr_user -d lr_oop_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    container_name: lr-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
