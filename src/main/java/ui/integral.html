<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Интеграл — ЛР7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="main.html" class="navbar-brand">← Назад</a>
        <span>∫ Интеграл</span>
    </div>
</nav>

<div class="container py-3">
    <div class="card bg-secondary">
        <div class="card-body">
            <h4>Вычисление определённого интеграла</h4>
            <p class="text-muted">Параллельное вычисление на всей области определения функции</p>

            <div class="mb-3">
                <label class="form-label">Функция</label>
                <select id="funcSelect" class="form-select bg-dark text-light" onchange="loadFunc()">
                    <option value="">Выберите функцию...</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Количество потоков (1–8)</label>
                <input type="range" class="form-range" id="threads" min="1" max="8" step="1" value="4">
                <div class="d-flex justify-content-between">
                    <span>1</span><span id="threadValue">4</span><span>8</span>
                </div>
            </div>

            <button class="btn btn-success" onclick="computeIntegral()">✅ Вычислить интеграл</button>

            <div id="resultArea" class="mt-4 d-none">
                <h5>Результат:</h5>
                <div class="alert alert-info" id="integralResult"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script>
    if (!localStorage.getItem('token')) window.location.href = 'index.html';

    let currentFunc = null;

    async function loadFunctions() {
      try {
        const funcs = await api.getFunctions();
        const sel = document.getElementById('funcSelect');
        sel.innerHTML = '<option value="">Выберите функцию...</option>';
        funcs.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = f.name;
          sel.appendChild(opt);
        });
      } catch (err) { showError(err); }
    }

    function loadFunc() {
      const id = document.getElementById('funcSelect').value;
      if (!id) return;
      api.client.get(`/v1/functions/${id}`)
        .then(r => r.json())
        .then(fn => currentFunc = fn)
        .catch(showError);
    }

    async function computeIntegral() {
      if (!currentFunc) return showError({ response: { status: 400,  { message: 'Выберите функцию' } } });
      const threads = parseInt(document.getElementById('threads').value);
      try {
        const value = await api.integrate(currentFunc.id, threads);
        document.getElementById('integralResult').textContent =
          `∫ f(x) dx = ${value.toFixed(6)} (потоков: ${threads})`;
        document.getElementById('resultArea').classList.remove('d-none');
        showSuccess('✅ Интеграл вычислен');
      } catch (err) { showError(err); }
    }

    // Слайдер
    document.getElementById('threads').addEventListener('input', (e) => {
      document.getElementById('threadValue').textContent = e.target.value;
    });

    document.addEventListener('DOMContentLoaded', loadFunctions);
</script>
</body>
</html>
