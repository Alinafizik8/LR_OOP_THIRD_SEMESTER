<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — ЛР7</title>
    <link rel="icon" href="favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container d-flex align-items-center min-vh-100">
    <div class="w-100" style="max-width: 400px;">
        <div class="card bg-secondary text-white">
            <div class="card-body">
                <h2 class="text-center mb-4">Вход</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-control bg-dark text-light" id="username" value="user" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control bg-dark text-light" id="password" value="word" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <hr />
                <div class="text-center">
                    <button class="btn btn-outline-light btn-sm" onclick="showRegister()">Регистрация</button>
                </div>
            </div>
        </div>

        <div id="registerForm" class="card bg-secondary text-white mt-3 d-none">
            <div class="card-body">
                <h3 class="text-center mb-3">Регистрация</h3>
                <form id="regForm" onsubmit="register(event)">
                    <div class="mb-3">
                        <input type="text" class="form-control bg-dark text-light" id="regUsername" placeholder="Логин" required minlength="3" />
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control bg-dark text-light" id="regPassword" placeholder="Пароль (≥4 символов)" required minlength="4" />
                    </div>
                    <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                    <button type="button" class="btn btn-outline-light btn-sm mt-2 w-100" onclick="showLogin()">← Назад к входу</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script>
    function showRegister() { document.getElementById('registerForm').classList.remove('d-none'); }
    function showLogin() { document.getElementById('registerForm').classList.add('d-none'); }

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      try {
        const { token } = await api.login(u, p);
        localStorage.setItem('token', token);
        window.location.href = 'main.html';
      } catch (err) {
        showError(err);
      }
    };

    async function register(e) {
      e.preventDefault();
      const u = document.getElementById('regUsername').value;
      const p = document.getElementById('regPassword').value;
      try {
        await api.register(u, p);
        showSuccess('Регистрация успешна. Войдите.');
        showLogin();
      } catch (err) {
        showError(err);
      }
    }
</script>
</body>
</html>
