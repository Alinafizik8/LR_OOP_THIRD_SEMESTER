<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>График — ЛР7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="main.html" class="navbar-brand">← Назад</a>
        <span>📈 График функции</span>
    </div>
</nav>

<div class="container py-3">
    <div class="row">
        <div class="col-lg-8">
            <div class="card bg-secondary mb-3">
                <div class="card-header">
                    <h5 class="mb-0">График</h5>
                </div>
                <div class="card-body">
                    <canvas id="chart" class="chart-container"></canvas>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card bg-secondary mb-3">
                <div class="card-header">Функция</div>
                <div class="card-body">
                    <select id="funcSelect" class="form-select bg-dark text-light mb-2" onchange="loadFunction()">
                        <option value="">Загрузка...</option>
                    </select>
                    <button class="btn btn-outline-primary w-100 mb-2" onclick="location.href='create.html?from=graph'">+ Создать</button>
                </div>
            </div>

            <div class="card bg-secondary">
                <div class="card-header">apply(x)</div>
                <div class="card-body">
                    <div class="input-group mb-2">
                        <input type="number" step="0.01" class="form-control bg-dark text-light" id="xInput" placeholder="x" value="0">
                        <button class="btn btn-primary" onclick="applyX()">Вычислить</button>
                    </div>
                    <div id="resultBox" class="alert alert-info d-none"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/chart.js"></script>
<script>
    if (!window.location.href.includes('index.html')) {
      // Проверка сессии
      fetch('/api/v1/functions')
        .catch(() => { if (!confirm('Сессия истекла. Обновить?')) location.href = 'index.html'; });
    }

    let currentFunction = null;

    async function loadFunctions() {
      try {
        const funcs = await api.getFunctions();
        const sel = document.getElementById('funcSelect');
        sel.innerHTML = '<option value="">Выберите функцию...</option>';
        funcs.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = f.name;
          sel.appendChild(opt);
        });
      } catch (err) { showError(err); }
    }

    async function loadFunction() {
      const id = document.getElementById('funcSelect').value;
      if (!id) return;
      try {
        const res = await fetch(`/api/v1/functions/${id}`);
        if (!res.ok) throw { response: { status: res.status, data: await res.json() } };
        currentFunction = await res.json();
        renderChart('chart', currentFunction.points, currentFunction.name);
      } catch (err) { showError(err); }
    }

    async function applyX() {
      if (!currentFunction) return showError({ response: { status: 400,  { message: 'Выберите функцию' } } });
      const x = parseFloat(document.getElementById('xInput').value);
      try {
        const res = await fetch(`/api/v1/functions/${currentFunction.id}/apply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ x })
        });
        if (!res.ok) throw { response: { status: res.status, data: await res.json() } };
        const { value } = await res.json();
        const box = document.getElementById('resultBox');
        box.textContent = `f(${x}) = ${value.toFixed(6)}`;
        box.classList.remove('d-none');
      } catch (err) { showError(err); }
    }

    document.addEventListener('DOMContentLoaded', loadFunctions);
</script>
</body>
</html>
