<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Настройки — ЛР7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="main.html" class="navbar-brand">← Назад</a>
        <span>⚙️ Настройки</span>
    </div>
</nav>

<div class="container py-4">
    <div class="card bg-secondary">
        <div class="card-body">
            <h3 class="mb-4">Выбор реализации фабрики</h3>
            <p class="text-muted mb-4">
                Фабрика используется для создания новых табулированных функций.
            </p>

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="factory" id="factoryArray" value="ARRAY" checked>
                <label class="form-check-label" for="factoryArray">
                    <strong>Массив</strong> — быстрый доступ по индексу, подходит для большинства случаев
                </label>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="radio" name="factory" id="factoryList" value="LINKED_LIST">
                <label class="form-check-label" for="factoryList">
                    <strong>Связный список</strong> — эффективен при частых вставках/удалениях (Insertable/Removable)
                </label>
            </div>

            <button class="btn btn-primary" onclick="saveFactory()">Сохранить</button>
            <button class="btn btn-outline-secondary ms-2" onclick="loadCurrent()">Загрузить текущую</button>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script>
    if (!localStorage.getItem('token')) window.location.href = 'index.html';

    async function loadCurrent() {
      try {
        const res = await api.client.get('/v1/settings/factory');
        const { factory } = await res.json();
        document.getElementById(`factory${factory}`).checked = true;
        showSuccess(`Текущая фабрика: ${factory === 'ARRAY' ? 'Массив' : 'Связный список'}`);
      } catch (err) { showError(err); }
    }

    async function saveFactory() {
      const value = document.querySelector('input[name="factory"]:checked').value;
      try {
        await api.client.put('/v1/settings/factory', { factory: value });
        showSuccess(`✅ Фабрика сохранена: ${value === 'ARRAY' ? 'Массив' : 'Связный список'}`);
        setTimeout(() => window.location.href = 'main.html', 1000);
      } catch (err) { showError(err); }
    }

    loadCurrent();
</script>
</body>
</html>
