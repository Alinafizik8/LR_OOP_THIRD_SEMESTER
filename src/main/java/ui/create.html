<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Создание функции — ЛР7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="main.html" class="navbar-brand">← Назад</a>
        <span>➕ Создание функции</span>
    </div>
</nav>

<div class="container py-3">
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#tabArrays">Из массивов x/y</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#tabMath">Из MathFunction</a>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Из массивов -->
        <div class="tab-pane fade show active" id="tabArrays">
            <div class="card bg-secondary">
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Имя функции</label>
                        <input type="text" class="form-control bg-dark text-light" id="arrName" placeholder="sin(x)" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Количество точек (2–1000)</label>
                        <input type="number" class="form-control bg-dark text-light" id="arrSize" min="2" max="1000" value="5" />
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark point-table" id="arrTable">
                            <thead><tr><th>x</th><th>y</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <button class="btn btn-success" onclick="createFromArray()">✅ Создать функцию</button>
                </div>
            </div>
        </div>

        <!-- Из MathFunction -->
        <div class="tab-pane fade" id="tabMath">
            <div class="card bg-secondary">
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Имя функции</label>
                        <input type="text" class="form-control bg-dark text-light" id="mathName" placeholder="sin(x)" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Функция</label>
                        <select class="form-select bg-dark text-light" id="mathFunc">
                            <option value="">Загрузка...</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col"><input type="number" step="0.1" class="form-control bg-dark text-light" id="mathFrom" placeholder="От" value="0" /></div>
                        <div class="col"><input type="number" step="0.1" class="form-control bg-dark text-light" id="mathTo" placeholder="До" value="1" /></div>
                        <div class="col"><input type="number" class="form-control bg-dark text-light" id="mathSteps" placeholder="Точек" value="10" min="2" /></div>
                    </div>
                    <button class="btn btn-success" onclick="createFromMath()">✅ Создать функцию</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script>
    if (!localStorage.getItem('token')) window.location.href = 'index.html';

    // Генерация таблицы
    function generateArrayTable() {
      const size = parseInt(document.getElementById('arrSize').value) || 5;
      if (size < 2) return showError({ response: { status: 400,  { message: 'Минимум 2 точки' } } });
      if (size > 1000) return showError({ response: { status: 400,  { message: 'Максимум 1000 точек' } } });

      const tbody = document.querySelector('#arrTable tbody');
      tbody.innerHTML = '';
      for (let i = 0; i < size; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="number" step="0.1" class="form-control bg-dark text-light" value="${i.toFixed(1)}" readonly></td>
          <td><input type="number" step="0.001" class="form-control bg-dark text-light" value="0"></td>
        `;
        tbody.appendChild(tr);
      }
    }

    // Загрузка функций
    async function loadMathFunctions() {
      try {
        const funcs = await api.getMathFunctions();
        const sel = document.getElementById('mathFunc');
        sel.innerHTML = '';
        funcs.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.key;
          opt.textContent = f.localized;
          sel.appendChild(opt);
        });
      } catch (err) { showError(err); }
    }

    // Создание из массива
    async function createFromArray() {
      const name = document.getElementById('arrName').value.trim();
      if (!name) return showError({ response: { status: 400,  { message: 'Введите имя функции' } } });

      const rows = document.querySelectorAll('#arrTable tbody tr');
      const points = Array.from(rows).map(tr => ({
        x: parseFloat(tr.cells[0].querySelector('input').value),
        y: parseFloat(tr.cells[1].querySelector('input').value)
      }));

      try {
        await api.createFunction({ name, points, type: 'TABULATED' });
        showSuccess(`✅ Функция «${name}» создана`);
        setTimeout(() => window.location.href = 'main.html', 1000);
      } catch (err) { showError(err); }
    }

    // Создание из MathFunction
    async function createFromMath() {
      const name = document.getElementById('mathName').value.trim();
      const key = document.getElementById('mathFunc').value;
      const from = parseFloat(document.getElementById('mathFrom').value);
      const to = parseFloat(document.getElementById('mathTo').value);
      const steps = parseInt(document.getElementById('mathSteps').value);

      if (!name || !key) return showError({ response: { status: 400,  { message: 'Заполните все поля' } } });

      try {
        await api.createFromMath(name, key, from, to, steps);
        showSuccess(`✅ Функция «${name}» создана`);
        setTimeout(() => window.location.href = 'main.html', 1000);
      } catch (err) { showError(err); }
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
      generateArrayTable();
      loadMathFunctions();
      document.getElementById('arrSize').addEventListener('input', generateArrayTable);
    });
</script>
</body>
</html>
