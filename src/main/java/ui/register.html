<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация — ЛР7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="index.html" class="navbar-brand">← Назад</a>
        <span>📝 Регистрация</span>
    </div>
</nav>

<div class="container py-4">
    <div class="card bg-secondary">
        <div class="card-body">
            <h3 class="text-center mb-4">Регистрация нового пользователя</h3>
            <form id="regForm">
                <div class="mb-3">
                    <label class="form-label">Логин (≥3 символов)</label>
                    <input type="text" class="form-control bg-dark text-light" id="regUsername" placeholder="Новый логин" required minlength="3" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль (≥4 символов)</label>
                    <input type="password" class="form-control bg-dark text-light" id="regPassword" placeholder="Новый пароль" required minlength="4" />
                </div>
                <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                <button type="button" class="btn btn-outline-light btn-sm mt-2 w-100" onclick="location.href='index.html'">← Назад к входу</button>
            </form>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script>
    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const u = document.getElementById('regUsername').value;
      const p = document.getElementById('regPassword').value;
      try {
        await api.register(u, p);
        showSuccess('✅ Регистрация успешна. Теперь войдите.');
        setTimeout(() => location.href = 'index.html', 1500);
      } catch (err) {
        showError(err);
      }
    };
</script>
</body>
</html>
