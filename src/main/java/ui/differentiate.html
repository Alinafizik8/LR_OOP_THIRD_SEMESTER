<nav class="navbar navbar-dark bg-primary">

<div class="container py-3">
    <div class="row g-3">
        <!-- Исходная функция -->
        <div class="col-lg-6">
            <div class="card bg-secondary h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Исходная функция</h5>
                    <div>
                        <button class="btn btn-sm btn-outline-primary" onclick="openCreate('source')">+ Создать</button>
                        <button class="btn btn-sm btn-outline-success ms-1" onclick="loadFunction('source')">⏎ Загрузить</button>
                    </div>
                </div>
                <div class="card-body d-flex flex-column">
                    <div class="mb-2">
                        <select id="funcSource" class="form-select bg-dark text-light" onchange="useSelected('source')">
                            <option value="">Выберите из списка...</option>
                        </select>
                    </div>
                    <div class="chart-container mb-2">
                        <canvas id="chartSource"></canvas>
                    </div>
                    <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                        <table class="table table-dark point-table" id="tableSource">
                            <thead><tr><th>x</th><th>y</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="insertSource" class="mt-2 d-none">
                        <button class="btn btn-sm btn-warning" onclick="insertPoint('source')">➕ Вставить точку</button>
                    </div>
                    <div id="removeSource" class="mt-1 d-none">
                        <button class="btn btn-sm btn-danger" onclick="removePoint('source')">🗑️ Удалить точку</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Производная -->
        <div class="col-lg-6">
            <div class="card bg-secondary h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Производная f′(x)</h5>
                    <button class="btn btn-sm btn-primary" onclick="differentiate()" title="Вычислить производную">
                        <strong>∂</strong> Дифференцировать
                    </button>
                </div>
                <div class="card-body d-flex flex-column">
                    <div class="chart-container mb-2">
                        <canvas id="chartDerivative"></canvas>
                    </div>
                    <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                        <table class="table table-dark point-table" id="tableDerivative">
                            <thead><tr><th>x</th><th>y</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <button class="btn btn-success mt-2 d-none" id="saveDerivative" onclick="saveDerivative()">
                        💾 Сохранить производную
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>
