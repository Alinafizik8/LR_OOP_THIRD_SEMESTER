<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дифференцирование — ЛР7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="main.html" class="navbar-brand">← Назад</a>
        <span>∂ Дифференцирование</span>
    </div>
</nav>

<div class="container py-3">
    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card bg-secondary h-100">
                <div class="card-header">
                    <h5 class="mb-0">Исходная функция</h5>
                </div>
                <div class="card-body d-flex flex-column">
                    <select id="funcSource" class="form-select bg-dark text-light mb-2" onchange="loadSource()">
                        <option value="">Выберите...</option>
                    </select>
                    <div class="chart-container mb-2">
                        <canvas id="chartSource"></canvas>
                    </div>
                    <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                        <table class="table table-dark point-table" id="tableSource">
                            <thead><tr><th>x</th><th>y</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="insertSource" class="mt-2 d-none">
                        <button class="btn btn-sm btn-warning" onclick="insertPoint()">➕ Вставить точку</button>
                    </div>
                    <div id="removeSource" class="mt-1 d-none">
                        <button class="btn btn-sm btn-danger" onclick="removePoint()">🗑️ Удалить точку</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card bg-secondary h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Производная f′(x)</h5>
                    <button class="btn btn-sm btn-primary" onclick="differentiate()">
                        <strong>∂</strong> Вычислить
                    </button>
                </div>
                <div class="card-body d-flex flex-column">
                    <div class="chart-container mb-2">
                        <canvas id="chartDerivative"></canvas>
                    </div>
                    <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                        <table class="table table-dark point-table" id="tableDerivative">
                            <thead><tr><th>x</th><th>y</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <button class="btn btn-success mt-2 d-none" id="saveBtn" onclick="saveDerivative()">
                        💾 Сохранить производную
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/chart.js"></script>
<script>
    let sourceFunction = null;
    let derivativeFunction = null;

    async function loadFunctions() {
      try {
        const funcs = await api.getFunctions();
        const sel = document.getElementById('funcSource');
        sel.innerHTML = '<option value="">Выберите...</option>';
        funcs.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = f.name;
          sel.appendChild(opt);
        });
      } catch (err) { showError(err); }
    }

    async function loadSource() {
      const id = document.getElementById('funcSource').value;
      if (!id) return;
      try {
        const res = await fetch(`/api/v1/functions/${id}`);
        if (!res.ok) throw { response: { status: res.status, data: await res.json() } };
        sourceFunction = await res.json();
        updateTable('tableSource', sourceFunction.points);
        renderChart('chartSource', sourceFunction.points, sourceFunction.name);
        checkInterfaces(sourceFunction);
      } catch (err) { showError(err); }
    }

    function updateTable(tableId, points) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      tbody.innerHTML = '';
      points.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.x.toFixed(4)}</td>
          <td contenteditable="true" oninput="updateY(${p.x}, this.innerText)">${p.y.toFixed(4)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateY(x, yStr) {
      const y = parseFloat(yStr);
      if (isNaN(y) || !sourceFunction) return;
      const point = sourceFunction.points.find(p => p.x === x);
      if (point) point.y = y;
    }

    function checkInterfaces(fn) {
      const isInsertable = fn.name?.toLowerCase().includes('list');
      const isRemovable  = fn.name?.toLowerCase().includes('list');
      document.getElementById('insertSource').classList.toggle('d-none', !isInsertable);
      document.getElementById('removeSource').classList.toggle('d-none', !isRemovable);
    }

    async function differentiate() {
      if (!sourceFunction) return showError({ response: { status: 400,  { message: 'Выберите исходную функцию' } } });
      try {
        const res = await fetch('/api/v1/differentiate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: sourceFunction.id })
        });
        if (!res.ok) throw { response: { status: res.status, data: await res.json() } };
        derivativeFunction = await res.json();
        updateTable('tableDerivative', derivativeFunction.points);
        renderChart('chartDerivative', derivativeFunction.points, `f′(x)`);
        document.getElementById('saveBtn').classList.remove('d-none');
        showSuccess('✅ Производная вычислена');
      } catch (err) { showError(err); }
    }

    function insertPoint() {
      if (!sourceFunction) return;
      const points = sourceFunction.points;
      if (points.length < 2) return showError({ response: { status: 400,  { message: 'Нужно ≥2 точки' } } });
      const mid = Math.floor(points.length / 2);
      const x = (points[mid-1].x + points[mid].x) / 2;
      const y = (points[mid-1].y + points[mid].y) / 2;
      points.splice(mid, 0, { x, y });
      updateTable('tableSource', points);
      renderChart('chartSource', points, sourceFunction.name);
      showSuccess(`➕ Точка (${x.toFixed(2)}, ${y.toFixed(2)}) вставлена`);
    }

    function removePoint() {
      if (!sourceFunction) return;
      const points = sourceFunction.points;
      if (points.length <= 2) return showError({ response: { status: 400,  { message: 'Минимум 2 точки' } } });
      points.pop();
      updateTable('tableSource', points);
      renderChart('chartSource', points, sourceFunction.name);
      showSuccess('🗑️ Точка удалена');
    }

    async function saveDerivative() {
      if (!derivativeFunction) return;
      try {
        const res = await fetch('/api/v1/functions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: `Производная от ${sourceFunction.name}`,
            points: derivativeFunction.points,
            type: 'TABULATED'
          })
        });
        if (!res.ok) throw { response: { status: res.status, data: await res.json() } };
        showSuccess('✅ Производная сохранена');
        setTimeout(() => location.reload(), 1500);
      } catch (err) { showError(err); }
    }

    document.addEventListener('DOMContentLoaded', loadFunctions);
</script>
</body>
</html>
