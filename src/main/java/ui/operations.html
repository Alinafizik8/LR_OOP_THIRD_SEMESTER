<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Операции — ЛР7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="main.html" class="navbar-brand">← Назад</a>
        <span>🧮 Операции</span>
    </div>
</nav>

<div class="container py-3">
    <div class="row g-3 mb-4">
        <!-- Операнд A -->
        <div class="col-md-6">
            <div class="card bg-secondary h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Функция A</span>
                    <div>
                        <button class="btn btn-sm btn-outline-primary" onclick="openCreate('A')">+ Создать</button>
                        <button class="btn btn-sm btn-outline-success ms-1" onclick="loadFunction('A')">⏎ Загрузить</button>
                    </div>
                </div>
                <div class="card-body">
                    <select id="funcA" class="form-select bg-dark text-light mb-2" onchange="useSelected('A')">
                        <option value="">Выберите из списка...</option>
                    </select>
                    <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                        <table class="table table-dark point-table" id="tableA">
                            <thead><tr><th>x</th><th>y</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="insertA" class="mt-2 d-none">
                        <button class="btn btn-sm btn-warning" onclick="insertPoint('A')">➕ Вставить точку</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Операнд B -->
        <div class="col-md-6">
            <div class="card bg-secondary h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Функция B</span>
                    <div>
                        <button class="btn btn-sm btn-outline-primary" onclick="openCreate('B')">+ Создать</button>
                        <button class="btn btn-sm btn-outline-success ms-1" onclick="loadFunction('B')">⏎ Загрузить</button>
                    </div>
                </div>
                <div class="card-body">
                    <select id="funcB" class="form-select bg-dark text-light mb-2" onchange="useSelected('B')">
                        <option value="">Выберите из списка...</option>
                    </select>
                    <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                        <table class="table table-dark point-table" id="tableB">
                            <thead><tr><th>x</th><th>y</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="insertB" class="mt-2 d-none">
                        <button class="btn btn-sm btn-warning" onclick="insertPoint('B')">➕ Вставить точку</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Результат -->
    <div class="card bg-secondary mb-3">
        <div class="card-header">
            <span>Результат</span>
            <button class="btn btn-sm btn-success float-end" onclick="saveResult()">💾 Сохранить</button>
        </div>
        <div class="card-body">
            <div class="btn-group mb-3" role="group">
                <button class="btn btn-outline-primary" onclick="applyOp('ADD')">➕ Сложить</button>
                <button class="btn btn-outline-primary" onclick="applyOp('SUBTRACT')">➖ Вычесть</button>
                <button class="btn btn-outline-primary" onclick="applyOp('MULTIPLY')">✖️ Умножить</button>
                <button class="btn btn-outline-primary" onclick="applyOp('DIVIDE')">➗ Разделить</button>
            </div>
            <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                <table class="table table-dark point-table" id="tableResult">
                    <thead><tr><th>x</th><th>y</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script>
    if (!localStorage.getItem('token')) window.location.href = 'index.html';

    let funcA = null, funcB = null, result = null;

    async function loadFunctions() {
      try {
        const funcs = await api.getFunctions();
        ['funcA', 'funcB'].forEach(id => {
          const sel = document.getElementById(id);
          sel.innerHTML = '<option value="">Выберите из списка...</option>';
          funcs.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.textContent = f.name;
            sel.appendChild(opt);
          });
        });
      } catch (err) { showError(err); }
    }

    function updateTable(tableId, points) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      tbody.innerHTML = '';
      points.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.x.toFixed(4)}</td>
          <td contenteditable="true" oninput="updateY('${tableId}', ${p.x}, this.innerText)">${p.y.toFixed(4)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateY(tableId, x, yStr) {
      const y = parseFloat(yStr);
      if (isNaN(y)) return;
      if (tableId === 'tableA') {
        const point = funcA.points.find(p => p.x === x);
        if (point) point.y = y;
      } else if (tableId === 'tableB') {
        const point = funcB.points.find(p => p.x === x);
        if (point) point.y = y;
      }
    }

    function useSelected(side) {
      const id = document.getElementById(`func${side}`).value;
      if (!id) return;
      api.client.get(`/v1/functions/${id}`)
        .then(r => r.json())
        .then(fn => {
          if (side === 'A') { funcA = fn; updateTable('tableA', fn.points); }
          else { funcB = fn; updateTable('tableB', fn.points); }
        })
        .catch(showError);
    }

    async function applyOp(op) {
      if (!funcA || !funcB) return showError({ response: { status: 400,  { message: 'Выберите обе функции' } } });
      try {
        result = await api.applyOperation(op, funcA.id, funcB.id);
        updateTable('tableResult', result.points);
        showSuccess(`✅ Операция ${op} выполнена`);
      } catch (err) { showError(err); }
    }

    function openCreate(side) {
      localStorage.setItem('opSide', side);
      window.location.href = 'create.html?op=1';
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', loadFunctions);
</script>
</body>
</html>
