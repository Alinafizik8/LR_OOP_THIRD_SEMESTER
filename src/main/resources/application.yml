server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: lr-oop-spring
  datasource:
    url: jdbc:postgresql://postgres:5432/lr_oop_db
    username: lr_user
    password: lr_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.alina: DEBUG
    org.springframework.security: DEBUG
