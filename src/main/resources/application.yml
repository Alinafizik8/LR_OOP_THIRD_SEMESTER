spring:
  application:
    name: lr-oop-spring

  datasource:
    url: jdbc:postgresql://postgres:5432/lr_oop_db
    username: lr_user
    password: lr_pass
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: create-drop   # для чистого старта при каждом запуске
    # или
    #      ddl-auto: update       # для сохранения данных между перезапусками
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    user:
      name: admin
      password: lr_secure_password321
      roles: ADMIN, USER

  jackson:
    default-property-inclusion: non_null

# Actuator — включаем эндпоинты
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans,metrics
  endpoint:
    health:
      enabled: true
      show-details: always
    info:
      enabled: true

logging:
  level:
    com.example.lr: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


