<header th:fragment="header" xmlns:th="http://www.thymeleaf.org" class="bg-primary text-white shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="d-flex align-items-center">
            <img th:src="@{/images/logo.svg}" alt="Logo" width="32" height="32" class="me-2">
            <span class="h5 mb-0">LR OOP Spring</span>
        </div>

        <nav>
            <ul class="nav">
                <li class="nav-item">
                    <a th:class="${#httpServletRequest.requestURI == '/' ? 'nav-link active' : 'nav-link'}"
                       th:href="@{/}">Главная</a>
                </li>
                <li class="nav-item">
                    <a th:class="${#httpServletRequest.requestURI == '/user/dashboard' ? 'nav-link active' : 'nav-link'}"
                       th:href="@{/user/dashboard}" th:if="${#authentication != null}">Личный кабинет</a>
                </li>
                <li class="nav-item">
                    <a th:class="${#httpServletRequest.requestURI == '/login' ? 'nav-link active' : 'nav-link'}"
                       th:href="@{/login}" th:if="${#authentication == null}">Войти</a>
                </li>
                <li class="nav-item">
                    <a th:class="${#httpServletRequest.requestURI == '/register' ? 'nav-link active' : 'nav-link'}"
                       th:href="@{/register}" th:if="${#authentication == null}">Регистрация</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/logout}" th:if="${#authentication != null}" class="nav-link" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();">
                        Выйти
                    </a>
                    <form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;"></form>
                </li>
                <li class="nav-item">
                    <button id="themeToggle" class="btn btn-outline-light btn-sm ms-2" onclick="toggleTheme()">
                        <i class="bi bi-moon-fill" id="themeIcon"></i>
                    </button>
                </li>
            </ul>
        </nav>
    </div>
</header>
