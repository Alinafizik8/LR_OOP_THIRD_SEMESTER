<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: main(title='Личный кабинет')">
<head></head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <h2>👋 Привет, <span th:text="${#authentication.principal.username}">Пользователь</span>!</h2>
            <p>Добро пожаловать в ваш личный кабинет.</p>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">📊 Активность</h5>
                    <canvas id="userActivityChart" width="400" height="200"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">ℹ️ Информация</h5>
                    <p><strong>Имя пользователя:</strong> <span th:text="${#authentication.principal.username}">-</span></p>
                    <p><strong>Роли:</strong>
                        <span th:each="role : ${#authentication.authorities}" th:text="${role.authority}">-</span>
                    </p>
                    <p><strong>Дата входа:</strong> <span th:text="${#dates.format(#dates.createNow(), 'dd.MM.yyyy HH:mm')}">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <button class="btn btn-outline-primary" onclick="showNotification('Это тестовое уведомление!', 'info')">
                Показать уведомление
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      initUserActivityChart('userActivityChart');
    });

    function initUserActivityChart(canvasId) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
          datasets: [{
            label: 'Количество действий',
            data: [12, 19, 15, 22, 28, 31, 25],
            backgroundColor: [
              'rgba(255, 99, 132, 0.2)',
              'rgba(54, 162, 235, 0.2)',
              'rgba(255, 206, 86, 0.2)',
              'rgba(75, 192, 192, 0.2)',
              'rgba(153, 102, 255, 0.2)',
              'rgba(255, 159, 64, 0.2)',
              'rgba(199, 199, 199, 0.2)'
            ],
            borderColor: [
              'rgba(255, 99, 132, 1)',
              'rgba(54, 162, 235, 1)',
              'rgba(255, 206, 86, 1)',
              'rgba(75, 192, 192, 1)',
              'rgba(153, 102, 255, 1)',
              'rgba(255, 159, 64, 1)',
              'rgba(199, 199, 199, 1)'
            ],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }
</script>
</body>
</html>
