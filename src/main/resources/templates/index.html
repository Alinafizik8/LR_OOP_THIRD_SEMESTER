<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="layout/main :: main(title='Главная')">
<head></head>
<body>
<main class="container mt-5">
    <div class="text-center">
        <h1>Добро пожаловать в LR OOP Spring!</h1>
        <p class="lead">Ваше приложение работает ✅</p>
        <div class="mt-4">
            <a href="/login" class="btn btn-primary">Войти</a>
            <a href="/register" class="btn btn-outline-secondary">Регистрация</a>
        </div>
    </div>

    <div class="mt-5 row">
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">📊 График активности</h5>
                    <canvas id="sampleChart" width="400" height="200"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">💡 Возможности</h5>
                    <ul>
                        <li>Авторизация через Spring Security</li>
                        <li>Тёмная/светлая тема</li>
                        <li>Графики с Chart.js</li>
                        <li>Уведомления</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      initSampleChart('sampleChart');
    });
</script>
</body>
</html>
